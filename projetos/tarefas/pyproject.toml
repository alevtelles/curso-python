[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tarefas"
version = "0.1.0"
description = "Gerenciador de tarefas em linha de comando (projeto da parte Intermediário)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tarefas = "tarefas.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

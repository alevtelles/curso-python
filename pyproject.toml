[project]
name = "python-notes"
version = "0.1.0"
description = "Código dos capítulos do livro Python na Prática"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
backend = [
    "httpx2>=2.0",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "pytest>=8",
]

[tool.uv]
package = false
